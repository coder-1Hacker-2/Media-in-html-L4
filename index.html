<!DOCTYPE html>
<html>
    <head>
        <title> My media page</title>
    </head>

    <body>
        
        <h1>This is a rocket!</h1>
        <p>Here is a picture of a rocket.</p>

        <h2>Image</h2>
        <img src="rocket2.png" alt="A rocket" width="500">  


        <h1>Audio</h1>
        <p>Here is some audio!</p>

        <h2>Audio</h2>
        <audio controls>
            <source src="sound.mp3" type="audio/mp3">
        </audio>


        <h1>Video</h1>
        <p>Here is a video!</p>

        <h2>Video</h2>

        <video width="320" height="240" controls>
            <source src="video.mp4" type="video/mp4">
        </video>

    
        <h2>Embed video</h2>
        <p>Here is a video from YouTube!</p>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/dYHspgJHhP8?si=aRfhVuqcF-oycO-G" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </body>


    
</html>
